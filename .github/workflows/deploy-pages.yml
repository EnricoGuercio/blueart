name: Deploy demo su GitHub Pages

# Preview temporanea per il cliente (stesso approccio già usato per Kikko the
# Alchemist). L'hosting definitivo resta Aruba — questo workflow non tocca
# quella parte, serve solo a pubblicare l'export statico ad ogni push su main
# finché siamo in questa fase di revisioni frequenti.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build (export statico)
        env:
          # Risolto da actions/configure-pages al path di un repository
          # Pages di progetto (es. "/nome-repo"); next.config.ts lo usa per
          # basePath/assetPrefix. Vuoto in locale e nel build per Aruba.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
